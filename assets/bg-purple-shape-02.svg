<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="430" viewBox="0 0 2880 430" fill="none">
  <!-- Ribbons, not water: a closed outline whose two edges pull apart
       through the middle and close to nothing at either end, which is how
       the thickness tapers - a stroke cannot. Both ends fade out too, so
       there is no edge to catch however far they travel.
       Several to a file on purpose. Each of these is a translucent layer
       the compositor blends every frame, and the cost is in how many there
       are rather than what is in them: three files cost forty percent of
       the frames during a pointer sweep, one cost two. -->
