<!-- Companion to auth-illustration.svg, in the same grammar — a card, a chip
     overlapping it, a dotted orbit, three sparks — but built for the dark
     panel and showing the other half of the story. Sign-in draws the survey
     you answer; sign-up draws what answering them adds up to.
     viewBox cropped to what is drawn plus room for the shadow to fall. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 14 400 292" width="400" height="292" role="img" aria-hidden="true">
  <title>A reward card and a balance of 275 points</title>

  <defs>
    <linearGradient id="r-face" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3182F8"/>
      <stop offset="1" stop-color="#0B3B96"/>
    </linearGradient>

    <linearGradient id="r-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA2FF"/>
      <stop offset="1" stop-color="#0B55CE"/>
    </linearGradient>

    <radialGradient id="r-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA4FF" stop-opacity="0.26"/>
      <stop offset="0.62" stop-color="#2E6FD8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2E6FD8" stop-opacity="0"/>
    </radialGradient>

    <filter id="r-card-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#02060F" flood-opacity="0.5"/>
    </filter>

    <filter id="r-chip-sh" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02060F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ground. On a dark panel the orbit is drawn in white rather than blue:
       the panel's own blue wash sits right behind it, and blue on blue
       disappears at this opacity. -->
  <circle cx="220" cy="150" r="140" fill="url(#r-glow)"/>
  <circle cx="220" cy="150" r="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.17"
          stroke-width="1.4" stroke-dasharray="2.5 9" stroke-linecap="round"/>
  <path d="M331 86 A128 128 0 0 1 346 172" fill="none" stroke="#8CC0FF" stroke-opacity="0.45"
        stroke-width="3" stroke-linecap="round"/>

  <g fill="#FFFFFF" opacity="0.2">
    <circle cx="48" cy="236" r="2.4"/><circle cx="64" cy="236" r="2.4"/><circle cx="80" cy="236" r="2.4"/>
    <circle cx="48" cy="252" r="2.4"/><circle cx="64" cy="252" r="2.4"/><circle cx="80" cy="252" r="2.4"/>
  </g>

  <!-- The reward card. -->
  <g transform="rotate(-5 200 150)">
    <rect x="62" y="62" width="250" height="158" rx="20"
          fill="url(#r-face)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"
          filter="url(#r-card-sh)"/>

    <!-- A sheen across the face, so it reads as a surface catching light
         rather than a flat blue rectangle. -->
    <path d="M62 150 L198 62 h94 a20 20 0 0 1 20 20 v36 L150 220 H82 a20 20 0 0 1-20-20z"
          fill="#FFFFFF" opacity="0.07"/>

    <rect x="86" y="92" width="30" height="23" rx="6" fill="#FFFFFF" opacity="0.72"/>
    <path d="M86 103.5h30M101 92v23" stroke="#1552B4" stroke-opacity="0.45" stroke-width="1.4"/>

    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round">
      <path d="M272 95a13 13 0 0 1 0 17"/>
      <path d="M279 90a20 20 0 0 1 0 27"/>
      <path d="M286 85a27 27 0 0 1 0 37"/>
    </g>

    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="86" cy="160" r="3"/><circle cx="95" cy="160" r="3"/><circle cx="104" cy="160" r="3"/><circle cx="113" cy="160" r="3"/>
      <circle cx="144" cy="160" r="3"/><circle cx="153" cy="160" r="3"/><circle cx="162" cy="160" r="3"/><circle cx="171" cy="160" r="3"/>
      <circle cx="203" cy="160" r="3"/><circle cx="212" cy="160" r="3"/><circle cx="221" cy="160" r="3"/><circle cx="230" cy="160" r="3"/>
      <circle cx="261" cy="160" r="3"/><circle cx="270" cy="160" r="3"/><circle cx="279" cy="160" r="3"/><circle cx="288" cy="160" r="3"/>
    </g>

    <rect x="86" y="184" width="74" height="8" rx="4" fill="#FFFFFF" opacity="0.42"/>

    <rect x="264" y="176" width="26" height="26" rx="9" fill="#FFFFFF" opacity="0.92"/>
    <path d="M271.5 189.2l3.6 3.6 7.4-7.6" fill="none" stroke="#0B55CE" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The balance, lifted off the card. 275 is the figure the panel's second
       bullet names, so the drawing and the copy are saying the same thing. -->
  <g transform="rotate(6 347 236)">
    <rect x="282" y="204" width="130" height="64" rx="22" fill="#FFFFFF" filter="url(#r-chip-sh)"/>

    <circle cx="318" cy="236" r="20" fill="url(#r-coin)"/>
    <circle cx="318" cy="236" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.4"/>
    <path d="M318 227c0 5.6.9 6.8 6.7 6.8-5.8 0-6.7 1.3-6.7 6.7 0-5.4-.9-6.7-6.7-6.7 5.8 0 6.7-1.2 6.7-6.8z"
          fill="#FFFFFF" opacity="0.95" transform="translate(0 2.2)"/>

    <text x="348" y="234" fill="#0B1437"
          font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif"
          font-size="23" font-weight="800" letter-spacing="-0.5">275</text>
    <text x="349" y="252" fill="#5F6787"
          font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif"
          font-size="12.5" font-weight="600" letter-spacing="0.1">points</text>
  </g>

  <!-- sparks -->
  <path d="M372 58c0 8.2 1.4 10 9.7 10-8.3 0-9.7 1.9-9.7 9.7 0-7.8-1.4-9.7-9.7-9.7 8.3 0 9.7-1.8 9.7-10z"
        fill="#9CCBFF" opacity="0.92"/>
  <path d="M60 176c0 5.4.9 6.6 6.4 6.6-5.5 0-6.4 1.2-6.4 6.4 0-5.2-.9-6.4-6.4-6.4 5.5 0 6.4-1.2 6.4-6.6z"
        fill="#9CCBFF" opacity="0.55"/>
  <path d="M106 42c0 4.1.7 5 4.9 5-4.2 0-4.9 1-4.9 4.9 0-3.9-.7-4.9-4.9-4.9 4.2 0 4.9-.9 4.9-5z"
        fill="#9CCBFF" opacity="0.4"/>
</svg>
