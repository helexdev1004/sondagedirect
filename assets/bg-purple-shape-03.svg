<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="760" viewBox="0 0 2880 760">
  <!-- Deliberately tall. The wave rides near the top and everything below
       it is solid, so the bottom of this image is always far past the
       bottom of the band. A shorter one ended partway down and its own
       edge showed as a hard horizontal line across the band.
       The crest fades out so the wave dissolves rather than starting on
       an edge — baked in here because a CSS mask over something this size
       cost half the frame rate. -->
  <defs>
    <linearGradient id="w3" x1="0" y1="224" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C8BF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3C8BF7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3C8BF7" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <path d="M-210 268 C-84 224 14 224 140 268 C266 312 364 312 490 268 C616 224 714 224 840 268 C966 312 1064 312 1190 268 C1316 224 1414 224 1540 268 C1666 312 1764 312 1890 268 C2016 224 2114 224 2240 268 C2366 312 2464 312 2590 268 C2716 224 2814 224 2940 268 C3066 312 3164 312 3290 268 C3416 224 3514 224 3640 268 V760 H-210 Z" fill="url(#w3)"/>
</svg>
